---
- name: Install Syncthing
  hosts: surface
  become: true
  tasks:
    - name: Install required dependencies
      ansible.builtin.apt:
        name:
          - curl
          - gpg
          - python3-lxml
        state: present
        update_cache: true

    - name: Add Syncthing APT signing key
      ansible.builtin.get_url:
        url: https://syncthing.net/release-key.gpg
        dest: /usr/share/keyrings/syncthing-archive-keyring.gpg

    - name: Add Syncthing APT repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/syncthing-archive-keyring.gpg]
          https://apt.syncthing.net/ syncthing stable
        filename: syncthing
        state: present

    - name: Install Syncthing package
      ansible.builtin.apt:
        name: syncthing
        state: present
        update_cache: true

- name: Configure syncthing for marcus
  hosts: surface
  tasks:
    - name: Enable and start syncthing user service
      ansible.builtin.systemd:
        name: syncthing.service
        enabled: true
        state: started
        scope: user

    - name: Read API key from Syncthing config
      community.general.xml:
        path: "/home/marcus/.local/state/syncthing/config.xml"
        xpath: /configuration/gui/apikey
        content: text
      register: syncthing_xml

    - name: Set API key fact
      ansible.builtin.set_fact:
        syncthing_api_key: "{{ syncthing_xml.matches[0].apikey }}"

    - name: Fetch Syncthing config via REST API
      ansible.builtin.uri:
        url: "http://localhost:8384/rest/config"
        method: GET
        headers:
          X-API-Key: "{{ syncthing_api_key }}"
        return_content: true
      register: syncthing_config

    - name: Add sync folders via REST API
      ansible.builtin.uri:
        url: "http://localhost:8384/rest/config/folders"
        method: POST
        headers:
          X-API-Key: "{{ syncthing_api_key }}"
          Content-Type: "application/json"
        body_format: json
        body:
          id: "{{ item | basename }}"
          path: "{{ item }}"
      loop: "{{ sync_dirs }}"
      when: "(item | basename) not in (syncthing_config.json.folders | map(attribute='id') | list)"
