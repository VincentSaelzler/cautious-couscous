---
- name: Install borgmatic package
  hosts: horrea
  become: true
  tasks:
    - name: Install borgmatic package
      ansible.builtin.pacman:
        name: borgmatic

- name: Configure borgmatic user settings
  hosts: horrea
  vars_prompt:
    - name: borg_passphrase
      prompt: "Borg Passphrase"
      private: yes
  tasks:
    - name: Ensure borgmatic config directory exists
      ansible.builtin.file:
        path: /home/marcus/.config/borgmatic
        state: directory

    - name: Deploy borgmatic configuration from template
      ansible.builtin.template:
        src: borgmatic_config.yml.j2
        dest: /home/marcus/.config/borgmatic/config.yaml

    - name: Initialize borgmatic repository
      ansible.builtin.command: borgmatic repo-create
      environment:
        BORG_PASSPHRASE: "{{ borg_passphrase }}"
      register: repo_create_result
      changed_when: repo_create_result.stderr != ""

- name: Test Borg restore process
  hosts: horrea
  vars_prompt:
    - name: borg_passphrase
      prompt: "Borg Passphrase"
      private: yes
  tasks:
    - name: Clear existing source directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ backup_dirs }}"

    - name: Clear temporary restore directory
      ansible.builtin.file:
        path: /home/marcus/restore
        state: absent

    - name: Create temporary restore directory
      ansible.builtin.file:
        path: /home/marcus/restore
        state: directory

    - name: Restore latest archive from local repo
      ansible.builtin.command: borgmatic extract --repository local --archive latest --destination /home/marcus/restore
      environment:
        BORG_PASSPHRASE: "{{ borg_passphrase }}"

    - name: Debug move paths
      ansible.builtin.debug:
        msg: 'Will move: "/home/marcus/restore{{ item }}" -> "{{ item }}"'
      loop: "{{ backup_dirs }}"

    - name: Move restored directories to permanent location
      ansible.builtin.command: mv "/home/marcus/restore{{ item }}" "{{ item }}"
      loop: "{{ backup_dirs }}"

    - name: Cleanup
      ansible.builtin.file:
        path: /home/marcus/restore
        state: absent
