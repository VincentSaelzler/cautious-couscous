---
- name: Configure borgmatic user settings
  hosts: horrea
  vars_prompt:
    - name: borg_passphrase
      prompt: "Borg Passphrase"
      private: yes
  tasks:
    - name: Ensure borgmatic config directory exists
      file:
        path: ~/.config/borgmatic
        state: directory

    - name: Deploy borgmatic configuration from template
      ansible.builtin.template:
        src: borgmatic_config.yml.j2
        dest: ~/.config/borgmatic/config.yaml

    - name: Initialize borgmatic repository
      ansible.builtin.command: borgmatic repo-create
      environment:
        BORG_PASSPHRASE: "{{ borg_passphrase }}"
      register: repo_create_result
      changed_when: repo_create_result.stderr != ""

- name: Install borgmatic and configure systemd service
  hosts: horrea
  become: true
  tasks:
    - name: Install borgmatic package
      ansible.builtin.pacman:
        name: borgmatic
    - name: Create borgmatic systemd service file
      ansible.builtin.copy:
        dest: /etc/systemd/system/borgmatic.service
        content: |
          [Unit]
          Description=borgmatic backup
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          RuntimeDirectory=borgmatic
          StateDirectory=borgmatic
          User=marcus
          WorkingDirectory=/home/marcus

          # Have systemd decrypt the encrypted blob and expose it at
          # /run/credentials/<unit>/borgmatic.pw before switching to User=marcus.
          LoadCredentialEncrypted=borgmatic.pw:/etc/credstore.encrypted/borgmatic.pw

          # Optional debug to confirm the runtime credential file exists (safe: does not print secret)
          ExecStartPre=/bin/sh -c 'ls -l "$CREDENTIALS_DIRECTORY" || true'

          # Read the runtime credential file into the environment and exec borgmatic.
          # This sets BORG_PASSPHRASE only for the borgmatic process and replaces the shell with borgmatic.
          ExecStart=/bin/sh -c 'BORG_PASSPHRASE="$(cat "$CREDENTIALS_DIRECTORY/borgmatic.pw")" exec /usr/bin/borgmatic --verbosity 2'
      register: borgmatic_service

    - name: Create borgmatic systemd timer file
      ansible.builtin.copy:
        dest: /etc/systemd/system/borgmatic.timer
        content: |
          [Unit]
          Description=Run borgmatic backup

          [Timer]
          OnCalendar=hourly

          [Install]
          WantedBy=timers.target
      register: borgmatic_timer

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
      when: borgmatic_service.changed or borgmatic_timer.changed

    - name: Enable and start borgmatic systemd timer
      ansible.builtin.systemd:
        name: borgmatic.timer
        enabled: true
        state: started
