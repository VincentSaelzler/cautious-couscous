- name: Setup Borg backup mount
  hosts: horrea
  become: true

  tasks:
    - name: Mount Borg backup volume
      # This creates the directory AND handles /etc/fstab
      ansible.posix.mount:
        path: /var/backups/borg
        src: LABEL=backups
        fstype: btrfs
        opts: rw,noatime,compress=zstd,ssd,space_cache=v2,discard=async
        dump: "0"
        passno: "0"
        state: mounted

    - name: Set ownership on the mounted filesystem
      # This applies the owner to the disk itself
      file:
        path: /var/backups/borg
        owner: marcus
        group: marcus
        state: directory

    - name: Set global Btrfs scrub schedule to hourly
      ansible.builtin.copy:
        dest: /usr/lib/systemd/system/btrfs-scrub@.timer
        content: |
          [Unit]
          Description=Btrfs scrub on %f

          [Timer]
          OnCalendar=hourly

          [Install]
          WantedBy=timers.target
      register: timer_override

    - name: Reload systemd to apply changes
      ansible.builtin.systemd:
        daemon_reload: true
      when: timer_override.changed

    - name: Ensure timer instance is enabled and started
      ansible.builtin.systemd:
        name: btrfs-scrub@var-backups-borg.timer
        enabled: true
        state: started

    - name: Gather merged timer unit (template + drop-ins)
      ansible.builtin.command:
        cmd: systemctl cat btrfs-scrub@.timer --no-pager
      register: timer_cat
      changed_when: false

    - name: Display merged timer unit (template + drop-ins)
      ansible.builtin.debug:
        msg: "{{ timer_cat.stdout_lines }}"
