---
- name: Copy configuration files to into /etc/ansible/
  hosts: localhost
  become: true

  tasks:
    - name: Ensure /etc/ansible directory exists
      file:
        path: /etc/ansible
        state: directory
        owner: marcus
        group: marcus

    - name: Copy inventory.yml to /etc/ansible/hosts
      copy:
        src: inventory.yml
        dest: /etc/ansible/hosts
        owner: marcus
        group: marcus

    - name: Copy ansible.cfg to /etc/ansible/ansible.cfg
      copy:
        src: ansible.cfg
        dest: /etc/ansible/
        owner: marcus
        group: marcus

- name: Configure Git
  hosts: localhost
  become: false
  tasks:
    - name: Set Git User
      git_config:
        name: user.name
        value: "Vincent Saelzler"
        scope: global
    - name: Set Git Email
      git_config:
        name: user.email
        value: "vincent.saelzler@gmail.com"
        scope: global
